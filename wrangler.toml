name = "beefyhub-ig"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Substitua pelo ID real da conta Cloudflare usada no deploy
account_id = "636bfe9f1652d341bab70a1f95936279"

kv_namespaces = [
  { binding = "PLATFORM_KV", id = "0be31f97b828444ca950bc6f4fff6e93" }
]

[vars]
BASE_URL = "https://beefyhub-ig.beefyhub.workers.dev"

# Configure via secrets (nunca commitar):
#   npx wrangler secret put IG_APP_ID
#   npx wrangler secret put IG_APP_SECRET
#   npx wrangler secret put WEBHOOK_VERIFY_TOKEN
#   npx wrangler secret put PANEL_USER
#   npx wrangler secret put PANEL_PASSWORD
#   npx wrangler secret put DIGISAC_TOKEN      # Bearer da API Digisac (beecont.digisac.app)
#   npx wrangler secret put DIGISAC_SERVICE_ID # UUID do servico WhatsApp
#   npx wrangler secret put DIGISAC_NUMBER     # numero admin (aprovacoes por WhatsApp), ex: 5511XXXXXXXXX
